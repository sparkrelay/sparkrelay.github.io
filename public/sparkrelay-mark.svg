<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SparkRelay</title>
  <desc id="desc">A glowing spark surrounded by blue and orange relay arcs.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3f5cff"/>
      <stop offset="1" stop-color="#16d9ff"/>
    </linearGradient>
    <linearGradient id="fire" x1=".15" y1="1" x2=".85" y2="0">
      <stop offset="0" stop-color="#ff5a2a"/>
      <stop offset=".55" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#ffe45a"/>
    </linearGradient>
    <linearGradient id="star" x1=".2" y1="1" x2=".8" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".5" stop-color="#fff8cf"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#020b25"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#153c91" stroke-width="3" opacity=".8"/>
  <g fill="none" stroke="url(#blue)" stroke-linecap="round" filter="url(#glow)">
    <path d="M84 356 C130 397 201 399 259 350" stroke-width="26"/>
    <path d="M252 349 C303 310 339 266 344 226 C348 188 329 164 303 157" stroke-width="26"/>
  </g>
  <g fill="none" stroke="#ff6a2d" stroke-linecap="round" filter="url(#glow)">
    <path d="M252 350 C210 320 181 292 180 257 C179 214 212 190 235 164 C259 137 267 105 256 72" stroke-width="30"/>
  </g>
  <path d="M252 350 C217 323 199 294 201 265 C204 235 229 216 248 193 C266 171 274 146 270 120 C299 156 309 190 297 222 C289 243 273 258 265 276 C254 300 257 325 252 350Z" fill="url(#fire)" filter="url(#glow)"/>
  <path d="M248 389 C248 389 213 369 214 344 C215 320 238 307 251 286 C265 307 287 322 287 345 C287 370 265 388 248 389Z" fill="url(#star)" filter="url(#glow)"/>
  <path d="M72 315 C111 284 142 271 174 266" fill="none" stroke="url(#blue)" stroke-width="10" stroke-linecap="round"/>
  <path d="M298 209 C342 188 385 183 422 197" fill="none" stroke="url(#blue)" stroke-width="10" stroke-linecap="round"/>
  <g fill="#26d9ff">
    <rect x="397" y="113" width="28" height="28" rx="3"/>
    <rect x="430" y="153" width="24" height="24" rx="3"/>
    <rect x="397" y="183" width="24" height="24" rx="3"/>
  </g>
</svg>